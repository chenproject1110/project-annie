<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — PROJECT ANNIE</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        background: #0a0a0a;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 20px; font-weight: 700; margin: 4px 0 0; color: #fff; }
      p { font-size: 14px; color: #9ca3af; max-width: 22rem; line-height: 1.5; margin: 0; }
      button {
        margin-top: 6px;
        padding: 10px 20px;
        border: none;
        border-radius: 999px;
        background: #7c3aed;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { transform: scale(0.96); }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg width="44" height="44" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6D28D9" />
            <stop offset="100%" stop-color="#8B5CF6" />
          </linearGradient>
        </defs>
        <path d="M50 10L20 90H35L50 50L65 90H80L50 10Z" fill="url(#g)" stroke="#8B5CF6" stroke-width="2" stroke-linejoin="round" />
        <circle cx="50" cy="65" r="8" fill="#F3F4F6" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>ANNIE needs a connection to pull anime data from AniList. Check your network and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
